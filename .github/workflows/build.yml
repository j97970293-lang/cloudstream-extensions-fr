name: Build and Publish

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins and generate manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon make makePluginsJson

      - name: Validate Nuvio providers
        run: |
          find nuvio -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Prepare published files
        run: |
          rm -rf published
          mkdir -p published
          test -f build/plugins.json
          cp build/plugins.json published/plugins.json
          cp repo.json published/repo.json
          find . -path '*/build/*.cs3' -type f -exec cp {} published/ \;
          test "$(find published -maxdepth 1 -name '*.cs3' | wc -l)" -gt 0
          find published -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./published
          publish_branch: builds
          force_orphan: true
          commit_message: "Build ${{ github.sha }}"
